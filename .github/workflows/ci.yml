name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Clone pstack (pinned ref)
        # private pstack repo ต้องมี secret PSTACK_CLONE_TOKEN (PAT อ่าน repo pstack ได้)
        run: |
          PSTACK_REF=$(grep '^PSTACK_REF=' .env.example | cut -d= -f2)
          echo "pinning pstack @ $PSTACK_REF"
          git clone --depth 1 --branch "$PSTACK_REF" \
            "https://oauth2:${{ secrets.PSTACK_CLONE_TOKEN }}@github.com/monthop-gmail/pstack.git" \
            pstack_src

      - name: Install
        run: pip install -e "./pstack_src[dev]"

      - name: Test
        run: pytest tests/ -q
